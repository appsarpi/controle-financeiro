name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # A acao tem limite interno de 10 min para aguardar o status. Quando a
      # propagacao demora mais, ela reporta erro mesmo tendo publicado, entao
      # quem decide o resultado do job e a verificacao real logo abaixo.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20

      - name: Verificar site publicado
        run: |
          VERSAO=$(grep -o 'Versão 1\.[0-9.]*' index.html | head -n1)
          URL="https://appsarpi.github.io/controle-financeiro/index.html"
          echo "Aguardando o site servir: $VERSAO"
          for i in $(seq 1 40); do
            if curl -fsSL "$URL?ci=$i" | grep -qF "$VERSAO"; then
              echo "Publicado com sucesso: $VERSAO"
              exit 0
            fi
            sleep 15
          done
          echo "O site nao refletiu $VERSAO dentro do tempo esperado."
          exit 1
